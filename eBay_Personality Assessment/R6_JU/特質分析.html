        :root {
            --primary-color: #789DBC;
            --accent-color: #FFE3E3;
            --success-color: #A8D5BA;
            --text-color: #4A4A4A;
            --text-light: #888;
            --bg-color: #FEF9F2;
            --white: #FFFFFF;
            --border-color: #E8E8E8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #FEF9F2 0%, #F5EFE7 100%);
            color: var(--text-color);
            line-height: 1.6;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Landing Page */
        .landing-page {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.8s ease-out;
        }

        .landing-page.hidden {
            display: none;
        }

        .landing-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            animation: bounce 0.6s ease-out;
        }

        .landing-page h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .landing-page p {
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto 30px;
        }

        .landing-page .highlight {
            font-weight: 700;
            color: var(--primary-color);
        }

        .landing-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), #5D86A8);
            color: white;
            padding: 16px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(120, 157, 188, 0.3);
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .landing-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(120, 157, 188, 0.4);
        }

        /* Card Container */
        .card-container {
            width: 100%;
            max-width: 500px;
            height: auto;
            max-height: 90vh;
            background: var(--white);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: cardAppear 0.6s ease-out;
        }

        .card-container.hidden {
            display: none;
        }

        /* Card Header */
        .card-header {
            background: linear-gradient(135deg, var(--primary-color), #A8C5D8);
            padding: 30px 25px;
            color: white;
            text-align: center;
            position: relative;
        }

        .card-header h1 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .card-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Progress Indicator */
        .progress-indicator {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-color);
            transition: width 0.5s ease;
        }

        /* Card Content */
        .card-content {
            flex: 1;
            padding: 40px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: slideInContent 0.5s ease-out;
        }

        .card-content::-webkit-scrollbar {
            width: 6px;
        }

        .card-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .card-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Question */
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .question-text .required {
            color: #E74C3C;
            margin-left: 3px;
        }

        /* Input Fields */
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            color: var(--text-color);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(120, 157, 188, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Options Group */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .option:hover {
            border-color: var(--primary-color);
            background: rgba(120, 157, 188, 0.05);
            transform: translateX(4px);
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-right: 12px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .option input[type="radio"]:checked,
        .option input[type="checkbox"]:checked {
            accent-color: var(--success-color);
        }

        .option.selected {
            background: rgba(120, 157, 188, 0.1);
            border-color: var(--primary-color);
            transform: translateX(4px);
        }

        .option label {
            flex: 1;
            cursor: pointer;
            margin: 0;
            font-size: 0.95rem;
        }

        /* Card Footer */
        .card-footer {
            padding: 25px 30px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.5);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
            flex: 1;
        }

        .btn-secondary {
            background: var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: #D0D0D0;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #5D86A8);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(120, 157, 188, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Success Screen */
        .success-screen {
            display: none;
            text-align: center;
            padding: 60px 30px;
            animation: slideInContent 0.5s ease-out;
        }

        .success-screen.show {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }

        .success-screen h2 {
            font-size: 1.5rem;
            color: var(--success-color);
            margin-bottom: 10px;
        }

        .success-screen p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInContent {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes slideOutLeft {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50px);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-out {
            animation: slideOutLeft 0.3s ease-out !important;
        }

        .slide-in {
            animation: slideInRight 0.3s ease-out !important;
        }

        /* Responsive */

            }

            .landing-page h1 {
                font-size: 1.8rem;
            }

            .landing-page p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

            document.getElementById('totalQuestions').textContent = formData.questions.length;
            renderQuestion(currentQuestionIndex);
            updateButtons();
        }

        // Render Question
        function renderQuestion(index) {
            const question = formData.questions[index];
            const cardContent = document.getElementById('cardContent');
            cardContent.innerHTML = '';

            // Check if success screen
            if (index >= formData.questions.length) {
                showSuccessScreen();
                return;
            }

            const questionContainer = document.createElement('div');
            questionContainer.className = 'slide-in';

            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.innerHTML = question.text + (question.required ? '<span class="required">*</span>' : '');
            questionContainer.appendChild(questionText);

            if (question.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-input';
                input.placeholder = '請輸入您的答案...';
                input.value = formValues[question.id] || '';
                input.required = question.required;
                input.addEventListener('change', (e) => {
                    formValues[question.id] = e.target.value;
                });
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        nextQuestion();
                    }
                });
                questionContainer.appendChild(input);
                setTimeout(() => input.focus(), 100);
            } else if (question.type === 'date') {
                const input = document.createElement('input');
                input.type = 'date';
                input.className = 'form-input';
                input.value = formValues[question.id] || '';
                input.required = question.required;
                input.addEventListener('change', (e) => {
                    formValues[question.id] = e.target.value;
                });
                questionContainer.appendChild(input);
                setTimeout(() => input.focus(), 100);
            } else if (question.type === 'textarea') {
                const textarea = document.createElement('textarea');
                textarea.className = 'form-textarea';
                textarea.placeholder = '請輸入您的答案...';
                textarea.value = formValues[question.id] || '';
                textarea.required = question.required;
                textarea.addEventListener('change', (e) => {
                    formValues[question.id] = e.target.value;
                });
                questionContainer.appendChild(textarea);
                setTimeout(() => textarea.focus(), 100);
            } else if (question.type === 'radio') {
                const optionsGroup = document.createElement('div');
                optionsGroup.className = 'options-group';

                question.options.forEach((option, optIndex) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q_${question.id}`;
                    input.value = option;
                    input.id = `q_${question.id}_${optIndex}`;
                    input.checked = formValues[question.id] === option;

                    const label = document.createElement('label');
                    label.htmlFor = `q_${question.id}_${optIndex}`;
                    label.textContent = option;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);

                    input.addEventListener('change', (e) => {
                        formValues[question.id] = e.target.value;
                        optionsGroup.querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        optionDiv.classList.add('selected');
                    });

                    if (input.checked) {
                        optionDiv.classList.add('selected');
                    }

                    optionsGroup.appendChild(optionDiv);
                });

                questionContainer.appendChild(optionsGroup);
            } else if (question.type === 'checkbox') {
                const optionsGroup = document.createElement('div');
                optionsGroup.className = 'options-group';

                question.options.forEach((option, optIndex) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';

                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.name = `q_${question.id}`;
                    input.value = option;
                    input.id = `q_${question.id}_${optIndex}`;

                    const currentValues = formValues[question.id] || [];
                    input.checked = currentValues.includes(option);

                    const label = document.createElement('label');
                    label.htmlFor = `q_${question.id}_${optIndex}`;
                    label.textContent = option;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);

                    input.addEventListener('change', (e) => {
                        const values = formValues[question.id] || [];
                        if (e.target.checked) {
                            if (!values.includes(option)) {
                                values.push(option);
                            }
                        } else {
                            const idx = values.indexOf(option);
                            if (idx > -1) {
                                values.splice(idx, 1);
                            }
                        }
                        formValues[question.id] = values;
                        if (values.length > 0) {
                            optionDiv.classList.add('selected');
                        } else {
                            optionDiv.classList.remove('selected');
                        }
                    });

                    if (input.checked) {
                        optionDiv.classList.add('selected');
                    }

                    optionsGroup.appendChild(optionDiv);
                });

                questionContainer.appendChild(optionsGroup);
            }

            cardContent.appendChild(questionContainer);
            updateProgress();
        }

        // Show Success Screen
        function showSuccessScreen() {
            const cardContent = document.getElementById('cardContent');
            cardContent.innerHTML = `
                <div class="success-screen show">
                    <div class="success-icon">✓</div>
                    <h2>感謝填寫！</h2>
                    <p>您的答案已成功提交，我們將盡快為您進行特質分析。</p>
                </div>
            `;
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        // Update Buttons
        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = currentQuestionIndex === 0;

            if (currentQuestionIndex === formData.questions.length - 1) {
                nextBtn.textContent = '提交 ✓';
            } else {
                nextBtn.textContent = '下一題 →';
            }
        }

        // Update Progress
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / formData.questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
        }

        // Validate Current Question
        function validateCurrentQuestion() {
            const question = formData.questions[currentQuestionIndex];
            if (question.required) {
                const value = formValues[question.id];
                if (!value || (Array.isArray(value) && value.length === 0)) {
                    alert('請填寫此題');
                    return false;
                }
            }
            return true;
        }

        // Next Question
        function nextQuestion() {
            if (!validateCurrentQuestion()) {
                return;
            }

            if (currentQuestionIndex === formData.questions.length - 1) {
                submitForm();
            } else {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
                updateButtons();
            }
        }

        // Previous Question
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion(currentQuestionIndex);
                updateButtons();
            }
        }

        // Submit Form
        function submitForm() {
            const formDataObj = new FormData();

            Object.keys(formValues).forEach(questionId => {
                const value = formValues[questionId];
                const entryId = entryMapping[questionId];

                if (entryId) {
                    if (Array.isArray(value)) {
                        value.forEach(v => {
                            formDataObj.append(entryId, v);
                        });
                    } else {
                        formDataObj.append(entryId, value);
                    }
                }
            });

            fetch(formData.formResponseUrl, {
                method: 'POST',
                body: formDataObj,
                mode: 'no-cors'
            }).then(() => {
                currentQuestionIndex = formData.questions.length;
                renderQuestion(currentQuestionIndex);
            }).catch(error => {
                console.error('Error:', error);
                alert('提交失敗，請稍後重試');
            });
        }

        // Event Listeners
        document.getElementById('startBtn').addEventListener('click', startForm);
        document.getElementById('prevBtn').addEventListener('click', prevQuestion);
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (formStarted) {
                if (e.key === 'ArrowRight') {
                    nextQuestion();
                } else if (e.key === 'ArrowLeft') {
                    prevQuestion();
                }
            }
        });
    </script>

</body>
</html>
